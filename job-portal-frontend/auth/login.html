<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page-body">

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Login Container -->
    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Left Form Side -->
            <div class="login-form-side">
                <h2>Welcome Back</h2>
                <p class="subtitle">Enter your credentials to access your Job portal</p>

                <form id="login-form">
                    <div id="login-message" class="auth-error-box"></div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="login-email" placeholder="alex.hunter@company.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="login-password" placeholder="••••••••••••" required>
                            <svg class="password-toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span>Login to your account</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>

                    <div class="register-footer">
                        Don't have an account yet? <a href="register.html">Register now</a>
                    </div>
                </form>
            </div>

            <!-- Right Info Side -->
            <div class="login-info">
                <div class="login-info-content">
                    <h1>Your next career<br>milestone <span class="blue-text">starts<br>here.</span></h1>
                </div>
                <div class="login-back-container">
                    <a href="../index.html" class="login-back-link">
                        <span class="back-circle">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                        </span>
                        Back
                    </a>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>

</body>

</html>
