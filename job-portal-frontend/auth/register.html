<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal — Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page-body">


    <!-- Register Container -->
    <div class="register-wrapper">
        <!-- Left Side: Brand & Title -->
        <div class="register-page-left">
            <div class="register-brand">Job Portal</div>
            <h1 class="register-title">Start your <span class="fw-bold">career</span><br><span class="fw-bold-italic">journey</span> with<br>Job Portal.</h1>
            <a href="../index.html" class="register-back-link">
                <span class="back-circle">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </span>
                Back
            </a>
        </div>

        <!-- Right Side: Form Card -->
        <div class="register-page-right">
            <div class="register-card">
                <h2>Create an account</h2>
                <p class="subtitle">Already have an account? <a href="login.html" class="text-black fw-bold">Log in</a></p>

                <form id="register-form">
                    <div id="register-error" class="auth-error-box"></div>

                    <!-- Role Pill Toggle -->
                    <div class="role-pill-toggle">
                        <input type="hidden" id="register-role" value="user">
                        <button type="button" class="role-pill active" data-role="user">Job Seeker</button>
                        <button type="button" class="role-pill" data-role="company">Employer</button>
                    </div>

                    <!-- Company notice shown dynamically -->
                    <div id="company-notice" class="info-notice auth-style-93b8ea">
                        Company accounts require admin approval before you can post jobs.
                    </div>

                    <div class="form-group">
                        <label id="name-label">Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="register-name" placeholder="Jane" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="register-email" placeholder="jane.doe@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="register-password" placeholder="••••••••••••" required>
                            <svg class="password-toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span id="submit-btn-text">Create Seeker Account</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>



    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/register.js"></script>

</body>

</html>
