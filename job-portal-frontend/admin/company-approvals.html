<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal — Company Approvals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page-body">

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <div class="admin-style-f7982d">
        <div class="admin-style-da363f">

            <!-- Page Header -->
            <div class="admin-style-096de2">
                <h1 class="admin-style-bc9ea5">Company Approvals</h1>
            </div>

            <!-- Approvals Table -->
            <div class="admin-style-decd1b">
                <div class="admin-style-87f73a">
                    <h2 class="admin-style-012496">Awaiting Verification</h2>
                    <div class="admin-style-d85c4e">
                        <svg class="admin-style-1c9fdb" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input id="company-search-input" type="text" placeholder="Search companies..." class="admin-style-ae0604">
                    </div>
                </div>

                <table class="admin-style-fe41d0">
                    <thead>
                        <tr class="admin-style-093d93">
                            <th class="admin-style-812502">Company Name</th>
                            <th class="admin-style-812502">Industry</th>
                            <th class="admin-style-812502">Submission Date</th>
                            <th class="admin-style-812502">Status</th>
                            <th class="admin-style-812502">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="companies-tbody">
                        <tr><td colspan="5" class="admin-style-d7eb25">Loading pending company registrations…</td></tr>
                    </tbody>
                </table>
                
                <div class="admin-style-40cf99">
                    <a href="#" class="admin-style-f9cf17">
                        View all pending requests
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/company-approvals.js"></script>
</body>
</html>
