<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal — User Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page-body">

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <div class="admin-style-f7982d">
        <div class="admin-style-da363f">

            <!-- Page Header -->
            <div class="admin-style-096de2">
                <h1 class="admin-style-bc9ea5">User Directory</h1>
            </div>

            <div class="admin-style-decd1b">
                <div class="admin-style-91e2ae">
                    <h2 class="admin-style-c4ee86">Directory Access</h2>
                </div>

                <table class="admin-style-fe41d0">
                    <thead>
                        <tr class="admin-style-093d93">
                            <th class="admin-style-812502">Full Name &amp; Email</th>
                            <th class="admin-style-812502">System Role</th>
                            <th class="admin-style-812502">Account Status</th>
                            <th class="admin-style-812502">Register Date</th>
                            <th class="admin-style-812502">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="5" class="admin-style-d7eb25">Loading users…</td></tr>
                    </tbody>
                </table>

                <div class="admin-style-302f5a">
                    <span id="users-count" class="admin-style-3f86c3"></span>
                    <div id="users-pagination" class="admin-style-1952d6"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/user-directory.js"></script>
</body>
</html>
