<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal — Job Listings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/jobs.css">
</head>
<body class="jobs-style-46372d">

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Listing Hero -->
    <section class="listing-hero jobs-style-828709">
        <div class="container jobs-style-eb46d9">
            <h1 class="listing-title jobs-style-fd950e">
                Find the perfect job that <span class="jobs-style-3aa024">elevates</span> your career
            </h1>

            <div class="search-box jobs-style-e28164">
                <div class="search-input-group jobs-style-269122">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="keyword-input" placeholder="Job title, keywords, or company..." class="jobs-style-0c46f1">
                </div>
                <div class="divider jobs-style-545c64"></div>
                <div class="search-input-group jobs-style-269122">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <input type="text" id="location-input" placeholder="Location (e.g., San Francisco)" class="jobs-style-0c46f1">
                </div>
                <button class="btn-search jobs-style-47ef00" id="search-btn">Search Jobs</button>
            </div>

            <div class="tags-row jobs-style-66a039">
                <span class="jobs-style-3dad24">Popular:</span>
                <a href="#" class="tag-pill jobs-style-f3516d">UI/UX Design</a>
                <a href="#" class="tag-pill jobs-style-f3516d">Full Stack</a>
                <a href="#" class="tag-pill jobs-style-f3516d">Marketing</a>
                <a href="#" class="tag-pill jobs-style-f3516d">Product Manager</a>
                <a href="#" class="tag-pill jobs-style-f3516d">Remote</a>
            </div>
        </div>
    </section>

    <!-- Listing Content -->
    <section class="listing-section jobs-style-4cec9a">
        <div class="container jobs-style-6c25a6">
            <div class="layout-grid jobs-style-2e750b">
                <!-- Sidebar Filters -->
                <aside class="filters-sidebar jobs-style-db8312">
                    <div class="filter-header jobs-style-e7511b">
                        <span>Filters</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    </div>

                    <div class="filter-section jobs-style-1e0990" data-filter="category">
                        <div class="filter-title jobs-style-4310cd">Job Category</div>
                        <div class="filter-options jobs-style-578b24">
                            <label class="checkbox-label jobs-style-19419c">
                                <div class="checkbox-left"><input type="checkbox"> Loading…</div>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section jobs-style-1e0990" data-filter="type">
                        <div class="filter-title jobs-style-4310cd">Job Type</div>
                        <div class="filter-options jobs-style-578b24">
                            <label class="checkbox-label jobs-style-19419c">
                                <div class="checkbox-left"><input type="checkbox"> Loading…</div>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section jobs-style-3e0512">
                        <div class="filter-title jobs-style-4310cd">Salary Range</div>
                        <input type="range" class="range-slider jobs-style-adae45" min="0" max="200000" value="200000">
                        <div class="range-values jobs-style-a26180">
                            <span>$0k</span>
                            <span>$100k</span>
                            <span>$200k+</span>
                        </div>
                    </div>
                </aside>

                <!-- Cards Grid -->
                <div>
                    <div class="results-header jobs-style-91e2ae">
                        <h3 id="results-count" class="jobs-style-c75c0b">Loading jobs…</h3>
                        <p class="jobs-style-c2a341">Jobs from our database in real-time</p>
                    </div>

                    <div class="jobs-cards-grid jobs-style-764000" id="jobs-grid">
                        <div class="jobs-style-4991c0">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="jobs-style-79db27"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                            Loading jobs from database…
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div class="pagination jobs-style-83b129">
                        <span class="jobs-style-ed61ef">Page 1 of 63</span>
                        <a href="#" class="page-btn jobs-style-9c5bd6">&lt;</a>
                        <a href="#" class="page-btn active jobs-style-a5b781">1</a>
                        <a href="#" class="page-btn jobs-style-9c5bd6">2</a>
                        <a href="#" class="page-btn jobs-style-9c5bd6">3</a>
                        <span class="jobs-style-fc346c">...</span>
                        <a href="#" class="page-btn jobs-style-9c5bd6">&gt;</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/job-listing.js"></script>
</body>
</html>
