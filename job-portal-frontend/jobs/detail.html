<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireMe — Senior Product Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <!--
    ============================================================
    TASK-001 — Naming update: replace "HireMe"/"HireHub" with "Job Portal"
    ============================================================
    PROBLEM: This page's <title> above (and possibly other text further
    down, like the navbar brand or footer) still uses an old site name
    ("HireMe" or "HireHub"). The site is now called "Job Portal" — update
    the <title> and any other leftover old-name text on this page.
    ASSIGNED TASK: Robins (A1) — Naming update, part of rebuilding every page.
    ============================================================

    ============================================================
    TASK-003 — Move this page's CSS into shared .css files
    ============================================================
    PROBLEM: This page has its own <style> block written directly inside
    the HTML file below, on top of the separate CSS files already linked
    above. Styling ends up scattered in two places, which makes it easy
    for the same kind of element (e.g. a button) to look different from
    page to page.
    WHAT YOU NEED TO DO, as you rebuild this page from the new Figma design:
      1. Never write a <style> block directly inside an HTML page again.
      2. Put anything used on almost every page (colors, fonts, buttons,
         spacing, navbar, the new profile popover) into ONE shared global
         CSS file that every page links to.
      3. Put styling specific to just this page/section into its own CSS
         file (e.g. one for dashboards, one for job pages, one for auth
         pages) — check the css/ folder for files that may already fit.
      4. Remove the <style>...</style> block below once its rules have
         been moved into the right .css file(s).
    WHAT "DONE" LOOKS LIKE: This page has NO <style> tag anywhere in it,
    and still looks correct because it links to CSS files instead.
    ASSIGNED TASK: Robins (A6) — Organize the CSS properly.
    ============================================================
    -->
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #F8F9FB;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        .nav-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 20px;
            color: #000;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: #111827;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
            font-size: 13px;
            font-weight: 500;
            color: #4B5563;
        }

        .nav-links a {
            text-decoration: none;
            color: inherit;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .nav-action-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #374151;
            text-decoration: none;
        }

        .btn-register {
            background: #111827;
            color: #ffffff;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        /* Detail Header */
        .detail-header {
            padding: 40px 0 30px;
            background: #ffffff;
            border-bottom: 1px solid #E5E7EB;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #6B7280;
            text-decoration: none;
            margin-bottom: 32px;
        }

        .header-content {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .company-badge-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #F3F4F6;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #111827;
            border: 1px solid #E5E7EB;
        }

        .job-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
        }

        .company-tags {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 13px;
            color: #6B7280;
            margin-bottom: 24px;
        }

        .tag-item {
            background: #F9FAFB;
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid #F3F4F6;
        }

        .header-pills {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .pill-card {
            background: #ffffff;
            border: 1px solid #E5E7EB;
            padding: 12px 24px;
            border-radius: 16px;
            text-align: center;
            min-width: 120px;
        }

        .pill-card label {
            display: block;
            font-size: 11px;
            color: #9CA3AF;
            margin-bottom: 2px;
        }

        .pill-card span {
            font-size: 13px;
            font-weight: 600;
            color: #111827;
        }

        /* Detail Layout */
        .detail-body {
            padding: 40px 0 80px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 40px;
            align-items: start;
        }

        /* Main Content */
        .content-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px;
            border: 1px solid #F3F4F6;
        }

        .section-block {
            margin-bottom: 32px;
        }

        .section-block h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
        }

        .section-block p {
            font-size: 14px;
            color: #4B5563;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .section-block ul {
            list-style-type: disc;
            padding-left: 20px;
            font-size: 14px;
            color: #4B5563;
            line-height: 1.7;
        }

        .section-block li {
            margin-bottom: 8px;
        }

        /* Sidebar Apply Card */
        .apply-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #F3F4F6;
            position: sticky;
            top: 92px;
        }

        .btn-apply-now {
            width: 100%;
            background: #111827;
            color: #ffffff;
            padding: 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
            margin-bottom: 24px;
        }

        .btn-already-applied {
            background: #E5E7EB;
            color: #4B5563;
            cursor: not-allowed;
        }

        .sidebar-meta-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-meta-item label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #9CA3AF;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .sidebar-meta-item span {
            font-size: 13px;
            font-weight: 600;
            color: #111827;
        }

        @media (max-width: 868px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/jobs.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Header -->
    <header class="detail-header" id="detail-header">
        <div class="container">
            <a href="listing.html" class="back-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Back to all jobs
            </a>
            <div class="header-content" id="header-content">
                <div style="text-align:center;padding:40px 0;color:#6B7280;">Loading job details…</div>
            </div>
        </div>
    </header>

    <!-- Body Layout -->
    <div class="detail-body">
        <div class="container">
            <div class="detail-grid">
                <!-- Main Job Info -->
                <div class="content-box" id="job-content">
                    <div style="text-align:center;padding:60px 0;color:#6B7280;">Loading…</div>
                </div>

                <!-- Sidebar Apply Card -->
                <aside class="apply-card" id="apply-sidebar">
                    <div style="text-align:center;padding:20px;color:#6B7280;">Loading…</div>
                </aside>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <!-- Apply Modal -->
    <!-- TODO — TASK-022 — Restyle this popup to match the new "Apply CV"
         design (Robins/A1, wiring already mostly works — Reeju/E2)
         PROBLEM: The apply logic below already works (uploads a résumé and
         creates the application), but the new Figma design shows a
         specific "Apply CV" popup style with a "Choose File" button and a
         "Submit Application" button. As Robins rebuilds this page, restyle
         this modal to match, and Reeju should double check the existing
         upload/submit logic further down in this file (search for
         `apiApplyToJob`) still works correctly once the HTML changes. -->
    <div id="apply-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;">
        <div style="background:#fff;border-radius:20px;padding:36px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,0.2);position:relative;" id="apply-modal-inner">
            <button id="close-modal" style="position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;font-size:18px;color:#6B7280;">✕</button>
            <h2 style="font-size:20px;font-weight:700;margin-bottom:6px;">Apply for this Job</h2>
            <p id="apply-job-title" style="font-size:13px;color:#6B7280;margin-bottom:24px;"></p>
            <div id="apply-error" style="display:none;color:#DC2626;background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:12px;font-size:13px;margin-bottom:16px;"></div>
            <form id="apply-form">
                <div style="margin-bottom:20px;">
                    <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:8px;">Upload Resume (PDF, DOC, DOCX)</label>
                    <input type="file" id="resume-file" accept=".pdf,.doc,.docx" required style="width:100%;padding:10px;border:1px solid #E5E7EB;border-radius:10px;font-size:13px;">
                </div>
                <button type="submit" id="apply-submit" style="width:100%;background:#111827;color:#fff;padding:14px;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/detail.js"></script>
</body>
</html>
