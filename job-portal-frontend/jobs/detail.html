<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal — Job Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/jobs.css">
</head>
<body class="jobs-style-46372d">

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Header -->
    <header class="detail-header">
        <div class="container jobs-style-8c7df6">
            <div class="jobs-style-37755b">
                <a href="listing.html" class="back-link jobs-style-e14f95">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    Back to all jobs
                </a>
                <span id="header-posted-date" class="jobs-style-649dc2"></span>
            </div>

            <div id="header-content" class="jobs-style-cdd8ca">
                <div class="jobs-style-c4460b">Loading job details…</div>
            </div>
        </div>
    </header>

    <!-- Body Layout -->
    <div class="detail-body jobs-style-ebb476">
        <div class="container jobs-style-eb46d9">
            <div id="job-content-card" class="jobs-style-a3b2b9">
                <div id="job-description-content"></div>
                <button id="open-apply-btn" class="jobs-style-9661fd">Apply Now</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <!-- Apply Modal -->
    <div id="apply-modal" class="jobs-style-daeb8e">
        <div class="jobs-style-dac028" id="apply-modal-inner">
            <button id="close-modal" class="jobs-style-476170">✕</button>
            <h2 class="jobs-style-5efbe4">Apply CV</h2>
            
            <div id="apply-error" class="jobs-style-a76376"></div>
            
            <form id="apply-form">
                <div class="jobs-style-1265ee">
                    <label class="jobs-style-bd6f8c">Upload Resume (PDF, DOC, DOCX)</label>
                    
                    <div class="jobs-style-408342">
                        <input type="file" id="resume-file" accept=".pdf,.doc,.docx" required class="jobs-style-93b8ea">
                        <label for="resume-file" class="jobs-style-cd2bad">Choose File</label>
                        <span id="file-name-display" class="jobs-style-1aca73">No file chosen</span>
                    </div>
                </div>
                
                <button type="submit" id="apply-submit" class="jobs-style-59bb4f">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/job-detail.js"></script>
</body>
</html>
