<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireMe — Post a New Opportunity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
        <!--
    ============================================================
    TASK-001 — Naming update: replace "HireMe"/"HireHub" with "Job Portal"
    ============================================================
    PROBLEM: This page's <title> above (and possibly other text further
    down, like the navbar brand or footer) still uses an old site name
    ("HireMe" or "HireHub"). The site is now called "Job Portal" — update
    the <title> and any other leftover old-name text on this page.
    ASSIGNED TASK: Robins (A1) — Naming update, part of rebuilding every page.
    ============================================================

    ============================================================
    TASK-003 — Move this page's CSS into shared .css files
    ============================================================
    PROBLEM: This page has its own <style> block written directly inside
    the HTML file below, on top of the separate CSS files already linked
    above. Styling ends up scattered in two places, which makes it easy
    for the same kind of element (e.g. a button) to look different from
    page to page.
    WHAT YOU NEED TO DO, as you rebuild this page from the new Figma design:
      1. Never write a <style> block directly inside an HTML page again.
      2. Put anything used on almost every page (colors, fonts, buttons,
         spacing, navbar, the new profile popover) into ONE shared global
         CSS file that every page links to.
      3. Put styling specific to just this page/section into its own CSS
         file (e.g. one for dashboards, one for job pages, one for auth
         pages) — check the css/ folder for files that may already fit.
      4. Remove the <style>...</style> block below once its rules have
         been moved into the right .css file(s).
    WHAT "DONE" LOOKS LIKE: This page has NO <style> tag anywhere in it,
    and still looks correct because it links to CSS files instead.
    ASSIGNED TASK: Robins (A6) — Organize the CSS properly.
    ============================================================
    -->
<style>
        /* Post-job specific styles that don't conflict with shared CSS */
        .post-job-hero {
            background: linear-gradient(180deg, #FFF0F5 0%, #F8F9FB 100%);
            padding: 60px 0 30px;
            text-align: center;
        }

        .post-job-hero h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .post-job-hero p {
            font-size: 14px;
            color: #6B7280;
            max-width: 540px;
            margin: 0 auto 24px;
        }

        .back-dash-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #6B7280;
            text-decoration: none;
        }

        .form-section {
            padding: 30px 0 80px;
        }

        .form-card {
            background: #ffffff;
            border-radius: 24px;
            max-width: 760px;
            margin: 0 auto;
            padding: 40px;
            border: 1px solid #F3F4F6;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .form-card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .form-card-sub {
            font-size: 12px;
            color: #9CA3AF;
            margin-bottom: 32px;
        }

        .section-header-step {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 20px;
            padding-top: 20px;
            border-top: 1px solid #F3F4F6;
        }

        .step-num {
            color: #DB2777;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            font-size: 13px;
            color: #111827;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #F9FAFB;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #E5E7EB;
            margin-bottom: 20px;
        }

        .toggle-label h5 {
            font-size: 13px;
            font-weight: 600;
        }

        .toggle-label p {
            font-size: 11px;
            color: #9CA3AF;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #E5E7EB;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #111827;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #F3F4F6;
        }

        .btn-cancel {
            font-size: 13px;
            font-weight: 600;
            color: #6B7280;
            text-decoration: none;
        }

        .btn-publish {
            background: #111827;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Post Job Hero -->
    <section class="post-job-hero">
        <div class="container">
            <h1>Post a New Opportunity</h1>
            <p>Reach a broad audience by creating a clear, detailed information card about the role and your company culture.</p>
            <a href="dashboard.html" class="back-dash-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Back to Dashboard
            </a>
        </div>
    </section>

    <!-- Form Section -->
    <div class="form-section">
        <div class="container">
            <div class="form-card">
                <h2 class="form-card-title">Job Details</h2>
                <p class="form-card-sub">Fields marked with an asterisk (*) are required</p>

                <!--
                ============================================================
                TASK-020 — Turn this into ONE shared Post Job / Edit Job form
                ============================================================
                PROBLEM: In Figma, the "Post a New Opportunity" page (this
                page) and the "Edit Post" page look almost identical — same
                fields, same layout. Right now this page only handles
                CREATING a new job (see the submit handler further down,
                which always calls apiCreateJob). Building Edit Job as a
                totally separate page would mean double the work and a risk
                of the two pages drifting apart visually over time.
                WHAT YOU NEED TO DO:
                  - Robins (A3): Turn this page into one shared page/form
                    that can show either "Post Job" or "Edit Job" mode, with
                    small differences: Edit Job mode needs a red "Delete
                    Job" button, and the submit button should say "Publish
                    Job" for create vs "Edit Job"/"Save Changes" for edit
                    (currently the button below always says "Publish Job" —
                    search this file for `btn-publish`/"Publish Job" further
                    down). One way to trigger "edit mode" is a query
                    parameter, e.g. post-job.html?id=123, or a hidden field
                    letting the JS below know which mode it's in.
                  - Simrika (D2): Once the shared form exists, make it work
                    in BOTH modes:
                      1. Create mode (already partly working below via
                         apiCreateJob) — keep this working.
                      2. Edit mode — when the page loads with a job id, load
                         that job's existing details into these same form
                         fields first (using apiGetJob(jobId)), then save
                         changes to that SAME job (using apiUpdateJob) when
                         submitted, instead of creating a new job.
                    Also wire up the new "Delete Job" button from A3 — make
                    it ask "are you sure?" (like the existing `deleteJob()`
                    confirm() call in company/dashboard.html) before
                    actually deleting, since deleting can't be undone.
                ASSIGNED TASK: Robins (A3, shared form UI) + Simrika (D2,
                shared form logic for both create and edit).
                ============================================================
                -->
                <form id="post-job-form">
                    <!-- Error Box -->
                    <div id="post-job-error" style="display:none;color:#DC2626;background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:12px;font-size:13px;margin-bottom:16px;"></div>

                    <!-- Step 1 -->
                    <div class="section-header-step" style="border: none; padding-top: 0;">
                        <span class="step-num">1</span>
                        <span>The Fundamentals</span>
                    </div>

                    <div class="form-group">
                        <label>Job Title *</label>
                        <input type="text" id="job-title" placeholder="e.g. Senior Product Designer" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="job-category" required>
                                <option value="">Select category</option>
                                <option value="IT">IT & Software</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Design">Design</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Finance">Finance</option>
                                <option value="Sales">Sales</option>
                                <option value="HR">HR</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Employment Type *</label>
                            <select id="job-type" required>
                                <option value="">Select employment type</option>
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Remote">Remote</option>
                                <option value="Contract">Contract</option>
                                <option value="Freelance">Freelance</option>
                            </select>
                        </div>
                    </div>

                    <!-- Step 2 -->
                    <div class="section-header-step">
                        <span class="step-num">2</span>
                        <span>Location & Pay</span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Location *</label>
                            <input type="text" id="job-location" placeholder="e.g. San Francisco, CA or Remote" required>
                        </div>
                        <div class="form-group">
                            <label>Salary Range (Annual USD) *</label>
                            <input type="text" id="job-salary" placeholder="e.g. $130,000 - $160,000" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Closing Date (optional)</label>
                            <input type="datetime-local" id="job-closing-date" placeholder="Closing date (optional)">
                        </div>
                        <div class="form-group">
                            <!-- spacer to keep layout consistent -->
                        </div>
                    </div>

                    <!--
                    ============================================================
                    TASK-021 — Add the Skills & Keywords tag input
                    ============================================================
                    PROBLEM: The new job-post form (per Figma) has a spot
                    where you type a skill (like "React") and press Enter or
                    comma to turn it into a small removable tag/pill, so a
                    company can list several required skills. This doesn't
                    exist on this page at all yet.
                    WHAT YOU NEED TO DO:
                      - Robins (A4): Build this tag-input box visually here
                        — it can start simple: a text input where typing a
                        word and pressing Enter/comma creates a small
                        removable pill (with an X to remove it), and all the
                        current tags get combined into one comma-separated
                        string when the form is submitted (e.g. matching
                        what the backend expects — see TASK-008 in
                        app/models/job.py, which stores skills as one
                        comma-separated string like "React, Figma, SQL").
                      - Simrika (D3): Once the visual tag box exists, make
                        sure the submit handler further down in this file
                        (search for `apiCreateJob`) reads the current list
                        of skills and includes it in the request body as
                        `skills: "React, Figma, SQL"`, and make sure it also
                        gets displayed correctly on the job detail page
                        (jobs/detail.html) afterwards.
                    ASSIGNED TASK: Robins (A4, visual tag input) + Simrika
                    (D3, saving/loading the skills data).
                    ============================================================
                    -->

                    <!-- Step 3 -->
                    <div class="section-header-step">
                        <span class="step-num">3</span>
                        <span>Role Description</span>
                    </div>

                    <div class="form-group">
                        <label>Job Description *</label>
                        <textarea id="job-description" rows="6" placeholder="Describe the day-to-day responsibilities, expectations, and necessary skills..." required></textarea>
                    </div>

                    <div class="form-actions">
                        <a href="dashboard.html" class="btn-cancel">Cancel & Discard</a>
                        <button type="submit" class="btn-publish" id="submit-btn">Publish Job</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await redirectIfNotLoggedIn('company');
            renderNavbar('post-job');
            renderFooter();

            const form = document.getElementById('post-job-form');
            const errDiv = document.getElementById('post-job-error');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errDiv.style.display = 'none';

                const title       = document.getElementById('job-title').value.trim();
                const category    = document.getElementById('job-category').value;
                const job_type    = document.getElementById('job-type').value;
                const location    = document.getElementById('job-location').value.trim();
                const salary      = document.getElementById('job-salary').value.trim();
                const description = document.getElementById('job-description').value.trim();
                const closing_date = (document.getElementById('job-closing-date').value || '').trim() || null;
                // TODO — TASK-021 continued (Simrika/D3): once Robins (A4)
                // has built the skills tag input, read its current tags
                // here (e.g. joining them into "React, Figma, SQL") and add
                // a `skills` line to the apiCreateJob(...) call below —
                // also see TASK-020 above about turning this whole form
                // into a shared Create/Edit form (Robins/A3, Simrika/D2).

                submitBtn.disabled = true;
                submitBtn.textContent = 'Publishing…';

                const { ok, data } = await apiCreateJob({
                    title,
                    category,
                    job_type,
                    location,
                    salary,
                    description
                    , closing_date
                });

                if (ok) {
                    showToast('Job posted successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = resolveSitePath('company/dashboard.html');
                    }, 1000);
                } else {
                    errDiv.textContent = data.error || data.message || 'Failed to create job posting. Check company approval status.';
                    errDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Publish Job';
                }
            });
        });
    </script>
</body>
</html>
