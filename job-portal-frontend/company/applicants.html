<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal — Applicant Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <div class="dashboard-style-f7982d">
        <div class="dashboard-style-da363f">

            <!-- Page Header -->
            <div class="dashboard-style-096de2">
                <h1 class="dashboard-style-d2c5d0">Applicant</h1>
            </div>

            <!-- Applicants Table -->
            <div class="dashboard-style-decd1b">
                <div class="dashboard-style-87f73a">
                    <h2 class="dashboard-style-012496">Applicant List</h2>
                    <div class="dashboard-style-d85c4e">
                        <svg class="dashboard-style-1c9fdb" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="applicant-search-input" placeholder="Search applicants..." class="dashboard-style-ae0604">
                    </div>
                </div>

                <table class="dashboard-style-fe41d0">
                    <thead>
                        <tr class="dashboard-style-093d93">
                            <th class="dashboard-style-812502">Applicant Name</th>
                            <th class="dashboard-style-812502">Role</th>
                            <th class="dashboard-style-812502">Applied Date</th>
                            <th class="dashboard-style-812502">Status</th>
                            <th class="dashboard-style-812502">CV</th>
                        </tr>
                    </thead>
                    <tbody id="applicants-table-body">
                        <tr><td colspan="5" class="dashboard-style-d7eb25">Loading applicants...</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Applicant Detail Modal -->
    <div id="applicant-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-box-head">
                <h3>Applicant Details</h3>
                <button class="modal-close-btn" id="close-applicant-modal">&times;</button>
            </div>

            <div class="modal-field">
                <label>Cover Letter</label>
                <div id="modal-cover-letter" class="dashboard-style-aac44a"></div>
            </div>

            <label class="dashboard-style-3e68c4">Update Status</label>
            <div class="dashboard-style-fede4b">
                <button data-status="under_review" class="btn-table-action dashboard-style-d5e8c5">Reviewing</button>
                <button data-status="shortlisted" class="btn-table-action approve dashboard-style-d5e8c5">Shortlist</button>
                <button data-status="rejected" class="btn-table-action danger dashboard-style-d5e8c5">Reject</button>
            </div>

            <input type="hidden" id="modal-application-id">
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/company-applicants.js"></script>
</body>
</html>
