<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireMe — Applicant Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #F8F9FB;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        .nav-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 20px;
            color: #000;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: #111827;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
            font-size: 13px;
            font-weight: 500;
            color: #4B5563;
        }

        .nav-links a {
            text-decoration: none;
            color: inherit;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .nav-action-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #374151;
            text-decoration: none;
        }

        .btn-register {
            background: #111827;
            color: #ffffff;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        /* Hero */
        .applicant-hero {
            background: linear-gradient(180deg, #FFF5F7 0%, #F8F9FB 100%);
            padding: 50px 0 30px;
            text-align: center;
        }

        .applicant-hero h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .applicant-hero p {
            font-size: 13px;
            color: #6B7280;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Main Table Section */
        .applicant-body {
            padding: 30px 0 80px;
        }

        .table-card {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #F3F4F6;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .table-toolbar {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #F3F4F6;
        }

        .toolbar-title {
            font-size: 16px;
            font-weight: 700;
        }

        .search-input-box {
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            padding: 8px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 220px;
        }

        .search-input-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 12px;
            width: 100%;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th {
            background: #F9FAFB;
            padding: 14px 24px;
            font-size: 11px;
            font-weight: 700;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #F3F4F6;
        }

        .data-table td {
            padding: 18px 24px;
            font-size: 13px;
            border-bottom: 1px solid #F3F4F6;
        }

        .user-name-cell {
            font-weight: 600;
            color: #111827;
        }

        .user-email-cell {
            font-size: 11px;
            color: #9CA3AF;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-shortlisted { background: #F3E8FF; color: #7E22CE; }
        .status-interview { background: #FEF3C7; color: #D97706; }
        .status-reviewing { background: #E0F2FE; color: #0369A1; }
        .status-pending { background: #F3F4F6; color: #6B7280; }
        .status-rejected { background: #FEE2E2; color: #B91C1C; }

        .action-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #6B7280;
        }

        .action-icon-btn {
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #E5E7EB;
        }

        .table-footer {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            font-size: 12px;
        }

        .page-num {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #374151;
            font-weight: 600;
        }

        .page-num.active {
            background: #111827;
            color: #ffffff;
        }
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Applicant Hero -->
    <section class="applicant-hero">
        <div class="container">
            <h1>Review Your Talent</h1>
            <p>Manage, evaluate, and communicate with applicants across all your active job postings from one centralized scorecard.</p>
        </div>
    </section>

    <!-- Applicant Body -->
    <div class="applicant-body">
        <div class="container">
            <div class="table-card">
                <div class="table-toolbar">
                    <div class="toolbar-title">Applicant List</div>
                    <div class="search-input-box">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search applicants...">
                    </div>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Applicant Name</th>
                            <th>Role</th>
                            <th>Applied Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicants-tbody">
                        <tr>
                            <td colspan="5" style="text-align:center;padding:40px;color:#6B7280;">Loading applicants…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            redirectIfNotLoggedIn('company');
            renderNavbar('applicants');
            renderFooter();

            await loadApplicants();
        });

        async function loadApplicants() {
            const tbody = document.getElementById('applicants-tbody');
            
            // 1. Get all jobs posted by company
            const { ok: jobsOk, data: jobs } = await apiGetJobs();
            if (!jobsOk || !Array.isArray(jobs) || jobs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#6B7280;">No active job postings found. Post a job first to receive applications.</td></tr>`;
                return;
            }

            // 2. Fetch applicants for each job
            let allApplicants = [];
            for (const job of jobs) {
                const { ok, data } = await apiGetJobApplicants(job.id);
                if (ok && Array.isArray(data)) {
                    data.forEach(app => {
                        allApplicants.push({
                            ...app,
                            job_title: job.title
                        });
                    });
                }
            }

            if (allApplicants.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#6B7280;">No candidates have applied to your jobs yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = allApplicants.map(app => `
                <tr style="border-bottom:1px solid #F3F4F6;">
                    <td style="padding:16px 24px;">
                        <div class="user-name-cell">${escapeHtml(app.user?.name || app.user_name || 'Applicant #' + app.user_id)}</div>
                        <div class="user-email-cell">${escapeHtml(app.user?.email || app.user_email || '')}</div>
                    </td>
                    <td style="padding:16px 24px;font-size:13px;">${escapeHtml(app.job_title)}</td>
                    <td style="padding:16px 24px;font-size:13px;color:#6B7280;">${(app.applied_at || app.created_at || '').split('T')[0] || 'Recently'}</td>
                    <td style="padding:16px 24px;">
                        <select onchange="handleStatusChange(${app.id}, this.value)" style="padding:4px 8px;border-radius:8px;border:1px solid #D1D5DB;font-size:12px;font-weight:600;">
                            <option value="applied" ${app.status === 'applied' ? 'selected' : ''}>Applied</option>
                            <option value="under_review" ${app.status === 'under_review' ? 'selected' : ''}>Under Review</option>
                            <option value="shortlisted" ${app.status === 'shortlisted' ? 'selected' : ''}>Shortlisted</option>
                            <option value="rejected" ${app.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                    </td>
                    <td style="padding:16px 24px;">
                        ${app.resume_path ? `<a href="${API_BASE_URL.replace('/api', '')}/${app.resume_path}" target="_blank" class="action-icon-btn" title="Download Resume" style="text-decoration:none;display:inline-block;">📥 Resume</a>` : '<span style="font-size:12px;color:#9CA3AF;">No file</span>'}
                    </td>
                </tr>
            `).join('');
        }

        async function handleStatusChange(appId, newStatus) {
            const { ok, data } = await apiUpdateApplicationStatus(appId, newStatus);
            if (ok) {
                showToast('Status updated successfully!', 'success');
            } else {
                showToast(data.error || 'Failed to update status.', 'error');
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
