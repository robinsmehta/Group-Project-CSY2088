<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireMe — Applicant Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
        <!--
    ============================================================
    TASK-001 — Naming update: replace "HireMe"/"HireHub" with "Job Portal"
    ============================================================
    PROBLEM: This page's <title> above (and possibly other text further
    down, like the navbar brand or footer) still uses an old site name
    ("HireMe" or "HireHub"). The site is now called "Job Portal" — update
    the <title> and any other leftover old-name text on this page.
    ASSIGNED TASK: Robins (A1) — Naming update, part of rebuilding every page.
    ============================================================

    ============================================================
    TASK-003 — Move this page's CSS into shared .css files
    ============================================================
    PROBLEM: This page has its own <style> block written directly inside
    the HTML file below, on top of the separate CSS files already linked
    above. Styling ends up scattered in two places, which makes it easy
    for the same kind of element (e.g. a button) to look different from
    page to page.
    WHAT YOU NEED TO DO, as you rebuild this page from the new Figma design:
      1. Never write a <style> block directly inside an HTML page again.
      2. Put anything used on almost every page (colors, fonts, buttons,
         spacing, navbar, the new profile popover) into ONE shared global
         CSS file that every page links to.
      3. Put styling specific to just this page/section into its own CSS
         file (e.g. one for dashboards, one for job pages, one for auth
         pages) — check the css/ folder for files that may already fit.
      4. Remove the <style>...</style> block below once its rules have
         been moved into the right .css file(s).
    WHAT "DONE" LOOKS LIKE: This page has NO <style> tag anywhere in it,
    and still looks correct because it links to CSS files instead.
    ASSIGNED TASK: Robins (A6) — Organize the CSS properly.
    ============================================================
    -->
<style>
        /* Applicant-specific styles that don't conflict with shared CSS */
        .applicant-hero {
            background: linear-gradient(180deg, #FFF5F7 0%, #F8F9FB 100%);
            padding: 50px 0 30px;
            text-align: center;
        }

        .applicant-hero h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .applicant-hero p {
            font-size: 13px;
            color: #6B7280;
            max-width: 500px;
            margin: 0 auto;
        }

        .applicant-body {
            padding: 30px 0 80px;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-shortlisted { background: #F3E8FF; color: #7E22CE; }
        .status-interview { background: #FEF3C7; color: #D97706; }
        .status-reviewing { background: #E0F2FE; color: #0369A1; }
        .status-pending { background: #F3F4F6; color: #6B7280; }
        .status-rejected { background: #FEE2E2; color: #B91C1C; }

        .action-icon-btn {
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #E5E7EB;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Applicant Hero -->
    <section class="applicant-hero">
        <div class="container">
            <h1>Review Your Talent</h1>
            <p>Manage, evaluate, and communicate with applicants across all your active job postings from one centralized scorecard.</p>
        </div>
    </section>

    <!-- Applicant Body -->
    <div class="applicant-body">
        <div class="container">
            <div class="table-card">
                <div class="table-toolbar">
                    <div class="toolbar-title">Applicant List</div>
                    <div class="search-input-box">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search applicants...">
                    </div>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Applicant Name</th>
                            <th>Role</th>
                            <th>Applied Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicants-tbody">
                        <tr>
                            <td colspan="5" style="text-align:center;padding:40px;color:#6B7280;">Loading applicants…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await redirectIfNotLoggedIn('company');
            renderNavbar('applicants');
            renderFooter();

            await loadApplicants();
        });

        async function loadApplicants() {
            const tbody = document.getElementById('applicants-tbody');
            const user = getLoggedInUser();
            
            // 1. Get all jobs posted by company
            const { ok: jobsOk, data } = await apiGetJobs();
            const jobs = jobsOk ? (data.jobs || (Array.isArray(data) ? data : [])) : [];
            if (!jobsOk || jobs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#6B7280;">No active job postings found. Post a job first to receive applications.</td></tr>`;
                return;
            }

            // Filter jobs to only show this company's jobs
            const companyJobs = jobs.filter(job => job.company_id === user.id || job.company_id === user.company_id);
            if (companyJobs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#6B7280;">No active job postings found. Post a job first to receive applications.</td></tr>`;
                return;
            }

            // 2. Fetch applicants for each job
            let allApplicants = [];
            for (const job of companyJobs) {
                const { ok, data } = await apiGetJobApplicants(job.id);
                const applications = ok ? (data?.applications || []) : [];
                if (applications.length) {
                    applications.forEach(app => {
                        allApplicants.push({
                            ...app,
                            job_title: job.title
                        });
                    });
                }
            }

            if (allApplicants.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:#6B7280;">No candidates have applied to your jobs yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = allApplicants.map(app => `
                <tr style="border-bottom:1px solid #F3F4F6;">
                    <td style="padding:16px 24px;">
                        <div class="user-name-cell">${escapeHtml(app.applicant_name || app.user?.name || app.user_name || 'Applicant #' + app.user_id)}</div>
                        <div class="user-email-cell">${escapeHtml(app.applicant_email || app.user?.email || app.user_email || '')}</div>
                    </td>
                    <td style="padding:16px 24px;font-size:13px;">${escapeHtml(app.job_title)}</td>
                    <td style="padding:16px 24px;font-size:13px;color:#6B7280;">${(app.applied_at || app.created_at || '').split('T')[0] || 'Recently'}</td>
                    <td style="padding:16px 24px;">
                        <!-- TODO — TASK-024 (Simrika/D7) — VERIFY ONLY: The
                             team agreed on exactly 4 application statuses:
                             Applied, Under Review, Shortlisted, Rejected.
                             This dropdown already only shows those 4 (good!)
                             — just double-check the wording/casing here
                             matches exactly what's saved to the database
                             (see the `status` Enum in
                             app/models/application.py on the backend, which
                             uses lowercase values like 'under_review') and
                             that no 5th option (like "Interview Scheduled"
                             or "Offered", used elsewhere in the old user
                             dashboard — see TASK-012/017 in
                             user/dashboard.html) ever gets added here. -->
                        <select onchange="handleStatusChange(${app.id}, this.value)" style="padding:4px 8px;border-radius:8px;border:1px solid #D1D5DB;font-size:12px;font-weight:600;">
                            <option value="applied" ${app.status === 'applied' ? 'selected' : ''}>Applied</option>
                            <option value="under_review" ${app.status === 'under_review' ? 'selected' : ''}>Under Review</option>
                            <option value="shortlisted" ${app.status === 'shortlisted' ? 'selected' : ''}>Shortlisted</option>
                            <option value="rejected" ${app.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                    </td>
                    <td style="padding:16px 24px;">
                        <!-- TODO — TASK-006 continued (Simrika/D6): this
                             resume_url link is what needs the ownership/
                             security check on the backend — see TASK-006
                             in app/routes/application_routes.py
                             (download_resume). No change needed here on
                             the frontend; this note is just for context. -->
                        ${app.resume_url ? `<a href="${API_BASE_URL.replace('/api', '')}${app.resume_url}" target="_blank" class="action-icon-btn" title="Download Resume" style="text-decoration:none;display:inline-block;">📥 Resume</a>` : '<span style="font-size:12px;color:#9CA3AF;">No file</span>'}
                    </td>
                </tr>
            `).join('');
        }

        async function handleStatusChange(appId, newStatus) {
            const { ok, data } = await apiUpdateApplicationStatus(appId, newStatus);
            if (ok) {
                showToast('Status updated successfully!', 'success');
            } else {
                showToast(data.error || 'Failed to update status.', 'error');
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
