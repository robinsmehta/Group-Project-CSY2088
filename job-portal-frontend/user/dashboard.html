<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal — Candidate Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="dash-body dashboard-style-b662f2">

    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <div class="dash-body">
        <div class="dash-container">
            <!-- Top Section -->
            <div class="dashboard-style-35d06b">
                <!-- Welcome Hero -->
                <div>
                    <h1 class="dashboard-style-abbf52">WELCOME, <span id="dash-user-name">User</span></h1>
                    <p class="dashboard-style-bb50ea"><strong class="dashboard-style-40f2c1">Your Career Journey</strong> is moving forward.</p>
                    <a href="../jobs/listing.html" class="dashboard-style-096649">
                        Explore Jobs
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"></line><polyline points="9 5 19 5 19 15"></polyline></svg>
                    </a>
                </div>

                <!-- Compact Step Path Graph -->
                <div class="dashboard-style-302538">
                    <!-- Connecting SVG line -->
                    <svg class="dashboard-style-c3ae94" viewBox="0 0 400 200" fill="none">
                        <path d="M120 20 L180 60 L240 100 L300 140" stroke="#E5E7EB" stroke-width="2" />
                    </svg>

                    <!-- Nodes -->
                    <div class="dashboard-style-f73843">
                        <span id="stat-total-applied" class="dashboard-style-66c06f">0</span>
                        <span class="dashboard-style-14ed5a">Total Applied</span>
                    </div>

                    <div class="dashboard-style-20f181">
                        <span id="stat-in-review" class="dashboard-style-66c06f">0</span>
                        <span class="dashboard-style-14ed5a">In Review</span>
                    </div>

                    <div class="dashboard-style-329ba6">
                        <span id="stat-shortlisted" class="dashboard-style-66c06f">0</span>
                        <span class="dashboard-style-14ed5a">Interviews</span>
                    </div>

                    <div class="dashboard-style-34acf5">
                        <span id="stat-rejected" class="dashboard-style-66c06f">0</span>
                        <span class="dashboard-style-14ed5a">Rejected</span>
                    </div>
                </div>
            </div>

            <hr class="dashboard-style-b5493e">

            <!-- Bottom Section: Split Layout -->
            <div id="main-content-grid" class="dashboard-style-b6f204">
                <!-- Left: Recent Applications -->
                <div>
                    <div class="dashboard-style-0d120b">
                        <h2 class="dashboard-style-c4ee86">Recent Applications</h2>
                        <div class="dashboard-style-d85c4e">
                            <svg class="dashboard-style-d4a9d1" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" placeholder="Search apps..." class="dashboard-style-3e09c8">
                        </div>
                    </div>
                    
                    <div id="applications-list-body" class="dashboard-style-578b24">
                        <div class="dashboard-style-d7eb25">Loading applications...</div>
                    </div>
                    
                    <div class="dashboard-style-b43733">
                        <span>Page 1 of 42</span>
                        <div class="dashboard-style-b13125">
                            <span class="dashboard-style-25c620">1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>...</span>
                            <span>42</span>
                        </div>
                    </div>
                </div>

                <!-- Right: Job Detail Pane -->
                <div id="job-detail-pane" class="dashboard-style-285b4c">
                    <h2 id="detail-title" class="dashboard-style-3a360a"></h2>
                    
                    <div class="dashboard-style-b1a8ce">
                        <div>
                            <div class="dashboard-style-7a06c0">JOB TYPE</div>
                            <div id="detail-type" class="dashboard-style-7055bb"></div>
                        </div>
                        <div>
                            <div class="dashboard-style-7a06c0">LOCATION</div>
                            <div id="detail-location" class="dashboard-style-7055bb"></div>
                        </div>
                        <div>
                            <div class="dashboard-style-7a06c0">COMPENSATION</div>
                            <div id="detail-salary" class="dashboard-style-7055bb"></div>
                        </div>
                    </div>

                    <div id="detail-description" class="dashboard-style-ed5f6e">
                    </div>

                    <div class="dashboard-style-bf247d">
                        <a id="detail-resume-btn" href="#" target="_blank" class="dashboard-style-5fdacc">View CV</a>
                        <button class="dashboard-style-735bc6">Applied</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/user-dashboard.js"></script>
</body>
</html>
